name: deploy

# CD: pushing a version tag promotes that commit to production.
#
#   git tag v0.3.1 && git push origin v0.3.1
#
# The tag re-runs the full CI gate, publishes a versioned image to GHCR, and
# rolls it out on the home server via a self-hosted runner installed there.
# Nothing needs to reach the server from the internet; the runner dials out.
#
# Pushes to main are gated by ci.yml but do NOT deploy — tagging is the promote
# step, so what runs in production is always a version you chose to ship.
#
# One-time setup on the server: see deploy/README.md.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Roll back: an already-published image tag (e.g. 0.3.0 or sha-abc1234). Nothing is rebuilt."
        required: true

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # A tag push doesn't trigger ci.yml on its own (that watches main and PRs), so
  # run the same gate here against the tagged commit. Tagging an old or unmerged
  # commit therefore can't slip past fmt/clippy/tests/web/docker.
  gate:
    name: ci gate
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci.yml

  publish:
    name: publish image → GHCR
    if: github.event_name == 'push'
    needs: gate
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # refs/tags/v0.3.1 → 0.3.1. This is the tag the server pins in .env, so
      # `docker compose ps` on the box reads as the version you shipped.
      - name: Derive version from the git tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          # latest=auto moves :latest only for a real release — a prerelease tag
          # like v0.4.0-rc1 publishes and deploys, but doesn't claim :latest.
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  rollout:
    name: roll out on the home server
    needs: publish
    # always(): a manual rollback skips gate+publish entirely, and a skipped
    # dependency would otherwise skip this job too.
    if: >
      always() &&
      (github.event_name == 'workflow_dispatch' || needs.publish.result == 'success')
    # Label the runner `easyclean` when registering it, so this only ever lands
    # on the box that actually holds the photos.
    runs-on: [self-hosted, linux, x64, easyclean]
    environment: production
    steps:
      - name: Deploy
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.publish.outputs.version }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_DIR: /opt/easyclean
        run: |
          set -euo pipefail
          cd "$DEPLOY_DIR"

          echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin

          # Rewrite EASYCLEAN_IMAGE_TAG in .env. Deliberately not `sed -i`: that
          # writes a temp file alongside .env and renames it, so it needs write
          # permission on $DEPLOY_DIR itself. Only .env is handed to the deploy
          # user (see deploy/README.md) and the directory stays root-owned —
          # writing back through the existing file needs the file alone.
          pin_tag() {
            local want="$1" tmp
            tmp="$(mktemp)"
            if grep -qE '^EASYCLEAN_IMAGE_TAG=' .env; then
              sed "s|^EASYCLEAN_IMAGE_TAG=.*|EASYCLEAN_IMAGE_TAG=$want|" .env > "$tmp"
            else
              { cat .env; echo "EASYCLEAN_IMAGE_TAG=$want"; } > "$tmp"
            fi
            cat "$tmp" > .env
            rm -f "$tmp"
          }

          # Remember what is running so a bad image can be backed out.
          PREV_TAG="$(grep -E '^EASYCLEAN_IMAGE_TAG=' .env | cut -d= -f2- || true)"
          echo "current: ${PREV_TAG:-<none>}  →  new: $TAG"

          docker pull "$IMAGE:$TAG"

          # Snapshot the index before swapping images. A release that adds a
          # migration changes the database in place, and a migration cannot be
          # un-applied — so this copy is the only way back to the previous
          # schema if a rollback ever needs one. Cheap: the DB holds the index
          # and review history, never the photos. Keeps the last 10.
          #
          # Done *inside a container* rather than from this shell: the data dir
          # belongs to uid 10001 (the container's user, see deploy/README.md)
          # and the deploy user only owns .env, so a plain `mkdir data/backups`
          # here fails with EPERM. The app image already runs as that uid.
          #
          # Best-effort: insurance must never be what blocks a deployment, so a
          # failure warns loudly and the rollout continues.
          #
          # `$TAG` reaches the container as an environment variable rather than
          # being spliced into this script. Closing the quote to interpolate it
          # — `...-pre-'"$TAG"'.db` — made the tag name part of the command the
          # inner shell parses, so a tag containing a quote or a semicolon ran
          # as code inside a container with the data volume mounted. Whoever
          # pushes a tag is trusted, but a deploy step should not turn a name
          # into an instruction.
          backup_index() {
            docker run --rm -v "$DEPLOY_DIR/data":/data -e TAG="$TAG" --entrypoint sh "$IMAGE:$TAG" -c '
              set -e
              [ -f /data/easyclean.db ] || { echo "no index yet — nothing to back up"; exit 0; }
              mkdir -p /data/backups
              cp /data/easyclean.db "/data/backups/easyclean-$(date +%Y%m%d-%H%M%S)-pre-${TAG}.db"
              # Keep the 10 newest, drop the rest.
              i=0
              for f in $(ls -1t /data/backups/easyclean-*.db 2>/dev/null || true); do
                i=$((i + 1))
                if [ "$i" -gt 10 ]; then rm -f "$f"; fi
              done
              echo "index backed up before rollout"
            '
          }
          backup_index || echo "::warning::could not back up the index — continuing with the rollout"

          # .env is the single source of truth for which tag runs here.
          pin_tag "$TAG"

          docker compose up -d

          # Health-check the port this host actually publishes, not a guess.
          APP_PORT="$(grep -E '^PORT=' .env | cut -d= -f2- || true)"
          APP_PORT="${APP_PORT:-8080}"

          echo "waiting for health on :$APP_PORT ..."
          for i in $(seq 1 60); do
            if curl -fsS "http://localhost:$APP_PORT/api/health" >/dev/null 2>&1; then
              echo "healthy after ${i}s"
              docker image prune -f >/dev/null 2>&1 || true
              exit 0
            fi
            sleep 1
          done

          echo "::error::new image never became healthy — rolling back"
          docker compose logs --tail=100 easyclean || true
          if [ -n "$PREV_TAG" ]; then
            pin_tag "$PREV_TAG"
            docker compose up -d
            echo "rolled back to $PREV_TAG"
          fi
          exit 1

      - name: Report running version
        if: success()
        working-directory: /opt/easyclean
        run: docker compose ps --format '{{.Name}}\t{{.Image}}\t{{.Status}}'
