[package]
name = "easyclean-core"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
sqlx = { workspace = true }
image = { workspace = true }
walkdir = "2"
kamadak-exif = "0.5"
chrono = "0.4"
bcrypt = "0.15"
jsonwebtoken = "9"
getrandom = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# Semantic search. ONNX Runtime links statically, so the runtime image needs no
# extra shared library; the weights themselves are fetched at runtime into the
# data dir rather than baked into the image.
ort = "2.0.0-rc.13"
tokenizers = { version = "0.20", default-features = false, features = ["onig"] }
ureq = "2"
# Verifies the downloaded weights against pinned digests. An ONNX file is an
# executable compute graph loaded straight into this process, so "whatever the
# server sent" is not a safe answer to what we are about to run.
sha2 = "0.10"
# HEIC/HEIF decode. Off by default: it links the system `libheif` (>= 1.17),
# which not every dev box has. The Docker image builds with it enabled.
# `v1_17` (not the default `latest`) keeps us compatible with the libheif that
# Debian ships (1.19.x) instead of requiring 1.21.
libheif-rs = { version = "2.7", optional = true, default-features = false, features = [
    "v1_17",
    "image",
] }

# Free-space checks before accepting an upload (`statvfs`). The standard library
# has no answer for "how much room is left on this filesystem", and this is the
# portable POSIX one. Unix-only on purpose: the deployment is a Linux container,
# and on anything else the check reports "unknown" and the quota carries the
# weight alone.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
default = []
heic = ["dep:libheif-rs"]
