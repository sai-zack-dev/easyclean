[package]
name = "easyclean-server"
edition.workspace = true
version.workspace = true
license.workspace = true

[features]
default = []
# HEIC/HEIF decode — needs system libheif >= 1.17. Enabled in the Docker image.
heic = ["easyclean-core/heic"]

[dependencies]
easyclean-core = { path = "../core" }
tokio = { workspace = true }
axum = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tower-http = { workspace = true }
mime_guess = { workspace = true }
tokio-stream = "0.1"
futures-util = "0.3"
# `oneshot` on tower-http's ServeFile, which is what streams originals with
# byte-range support. Already in the tree through axum and tower-http.
tower = { version = "0.5", features = ["util"] }

[dev-dependencies]
# Only for tests: compute the digest an uploading client would send, so the
# upload tests exercise the real hash check rather than a value the server
# handed itself.
sha2 = "0.10"
# Only for tests: build a fixture photo, then measure the preview that comes
# back. Decoding in the server itself always goes through easyclean-core.
image = { workspace = true }
