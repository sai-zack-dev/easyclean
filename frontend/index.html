<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
    />
    <title>EasyClean</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap");

      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      :root {
        --bg: #0a0a0a;
        --bg2: #111111;
        --bg3: #1c1c1e;
        --bg4: #2c2c2e;
        --surface: #3a3a3c;
        --text: #ffffff;
        --text2: rgba(255, 255, 255, 0.55);
        --text3: rgba(255, 255, 255, 0.28);
        --keep: #30d158;
        --delete: #ff453a;
        --accent: #ffffff;
        --border: rgba(255, 255, 255, 0.08);
        --border2: rgba(255, 255, 255, 0.12);
        --font: "Inter", sans-serif;
        --r: 14px;
        --r-lg: 20px;
        --r-pill: 100px;
        --sidebar: 240px;
        --tab: 72px;
        --ease: cubic-bezier(0.25, 0.46, 0.45, 0.94);
      }

      html,
      body {
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: var(--font);
        overflow: hidden;
        font-size: 15px;
      }

      /* ── LAYOUT ─────────────────────────────── */
      #app {
        display: flex;
        height: 100dvh;
        width: 100%;
      }

      /* SIDEBAR (desktop) */
      .sidebar {
        width: var(--sidebar);
        flex-shrink: 0;
        background: var(--bg2);
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        padding: 32px 12px 24px;
        gap: 4px;
        overflow: hidden;
      }
      .sidebar-brand {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 8px 24px;
      }
      .sidebar-brand-icon {
        width: 32px;
        height: 32px;
        background: var(--text);
        border-radius: 9px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }
      .sidebar-brand-icon svg {
        width: 18px;
        height: 18px;
        fill: var(--bg);
      }
      .sidebar-brand-name {
        font-size: 17px;
        font-weight: 700;
        letter-spacing: -0.3px;
      }
      .sidebar-brand-ver {
        font-size: 11px;
        color: var(--text3);
        margin-top: 1px;
      }

      .nav-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 12px;
        border-radius: var(--r);
        cursor: pointer;
        transition: background 0.15s var(--ease);
        color: var(--text2);
        font-size: 14px;
        font-weight: 500;
        position: relative;
      }
      .nav-item svg {
        width: 18px;
        height: 18px;
        flex-shrink: 0;
        stroke: currentColor;
        fill: none;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .nav-item:hover {
        background: rgba(255, 255, 255, 0.05);
        color: var(--text);
      }
      .nav-item.active {
        background: rgba(255, 255, 255, 0.1);
        color: var(--text);
      }
      .nav-item.active svg {
        stroke: var(--text);
      }

      .sidebar-spacer {
        flex: 1;
      }
      .sidebar-user {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 12px;
        border-radius: var(--r);
        border: 1px solid var(--border);
        cursor: pointer;
      }
      .sidebar-avatar {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        background: var(--surface);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        font-weight: 700;
        flex-shrink: 0;
      }
      .sidebar-username {
        font-size: 13px;
        font-weight: 600;
      }
      .sidebar-role {
        font-size: 11px;
        color: var(--text3);
      }

      /* MAIN CONTENT */
      .main {
        flex: 1;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        min-width: 0;
      }
      .screen {
        flex: 1;
        overflow-y: auto;
        overflow-x: hidden;
        -webkit-overflow-scrolling: touch;
      }
      .screen::-webkit-scrollbar {
        width: 0;
      }

      /* BOTTOM TAB BAR (mobile) */
      .tabbar {
        display: none;
        height: var(--tab);
        background: rgba(15, 15, 15, 0.92);
        backdrop-filter: blur(24px) saturate(180%);
        -webkit-backdrop-filter: blur(24px) saturate(180%);
        border-top: 1px solid var(--border);
        flex-shrink: 0;
        align-items: flex-start;
        justify-content: space-around;
        padding: 8px 0 0;
      }
      .tab-btn {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        cursor: pointer;
        padding: 4px 0;
        background: none;
        border: none;
        color: var(--text3);
        transition: color 0.2s;
      }
      .tab-btn svg {
        width: 22px;
        height: 22px;
        stroke: currentColor;
        fill: none;
        stroke-width: 1.7;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .tab-btn.active {
        color: var(--text);
      }
      .tab-btn .tab-label {
        font-size: 10px;
        font-weight: 500;
        letter-spacing: 0.2px;
      }

      /* ── MOBILE BREAKPOINT ───────────────────── */
      @media (max-width: 700px) {
        .sidebar {
          display: none;
        }
        .tabbar {
          display: flex;
        }
      }

      /* ── COMMON COMPONENTS ───────────────────── */
      .page-pad {
        padding: 0 16px;
      }
      .page-header {
        padding: 16px 20px 12px;
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
      }
      .page-title {
        font-size: 32px;
        font-weight: 800;
        letter-spacing: -0.6px;
      }
      .page-subtitle {
        font-size: 13px;
        color: var(--text2);
        margin-top: 2px;
      }

      .pill-btn {
        display: flex;
        align-items: center;
        gap: 6px;
        background: var(--bg3);
        border: 1px solid var(--border2);
        color: var(--text);
        padding: 8px 16px;
        border-radius: var(--r-pill);
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        font-family: var(--font);
        transition: all 0.15s;
        white-space: nowrap;
        border: none;
      }
      .pill-btn svg {
        width: 14px;
        height: 14px;
        stroke: currentColor;
        fill: none;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
        flex-shrink: 0;
      }
      .pill-btn:active {
        opacity: 0.7;
        transform: scale(0.97);
      }

      .section-label {
        font-size: 12px;
        font-weight: 600;
        color: var(--text3);
        letter-spacing: 0.5px;
        margin-bottom: 10px;
        text-transform: uppercase;
      }

      .card {
        background: var(--bg3);
        border-radius: var(--r-lg);
        padding: 16px;
      }
      .list-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 14px 16px;
        background: var(--bg3);
        border-radius: var(--r-lg);
        cursor: pointer;
        transition: opacity 0.15s;
        margin-bottom: 8px;
      }
      .list-row:active {
        opacity: 0.7;
      }
      .list-row-left {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .row-icon {
        width: 36px;
        height: 36px;
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.07);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }
      .row-icon svg {
        width: 18px;
        height: 18px;
        stroke: var(--text2);
        fill: none;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .row-title {
        font-size: 15px;
        font-weight: 500;
      }
      .row-sub {
        font-size: 12px;
        color: var(--text3);
        margin-top: 1px;
      }
      .row-right {
        display: flex;
        align-items: center;
        gap: 6px;
        color: var(--text3);
        font-size: 13px;
      }
      .row-right svg {
        width: 14px;
        height: 14px;
        stroke: var(--text3);
        fill: none;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .row-count {
        font-size: 14px;
        font-weight: 600;
        color: var(--text);
      }

      .chevron {
        width: 14px;
        height: 14px;
        stroke: var(--text3);
        fill: none;
        stroke-width: 2.5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      /* ── CLEAN TAB ───────────────────────────── */
      .streak-card {
        background: var(--bg3);
        border-radius: var(--r-lg);
        padding: 16px;
        margin: 0 16px 10px;
      }
      .streak-days {
        display: flex;
        gap: 3px;
        justify-content: space-between;
        margin-bottom: 14px;
      }
      .streak-day {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 5px;
        min-width: 0;
      }
      .streak-day-lbl {
        font-size: 8px;
        color: var(--text3);
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 0.3px;
      }
      .s-ring {
        width: 30px;
        height: 30px;
        min-width: 30px;
        border-radius: 50%;
        border: 2.5px solid rgba(255, 255, 255, 0.12);
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s;
        position: relative;
        flex-shrink: 0;
      }
      .s-ring.done {
        border-color: rgba(255, 255, 255, 0.4);
      }
      .s-ring.done svg {
        opacity: 0.7;
      }
      .s-ring.today {
        border-color: var(--text);
        background: var(--text);
      }
      .s-ring.today svg path,
      .s-ring.today svg polyline {
        stroke: var(--bg);
      }
      .s-ring svg {
        width: 11px;
        height: 11px;
        stroke: var(--text3);
        fill: none;
        stroke-width: 2.5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .streak-meta {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .streak-badge {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        color: var(--text2);
        font-weight: 500;
      }
      .streak-badge svg {
        width: 14px;
        height: 14px;
        stroke: currentColor;
        fill: none;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .quick-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin: 0 16px 10px;
      }
      .quick-card {
        background: var(--bg3);
        border-radius: var(--r-lg);
        padding: 14px 14px 12px;
        cursor: pointer;
        transition: all 0.15s;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .quick-card:active {
        transform: scale(0.97);
        opacity: 0.8;
      }
      .quick-card-top {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
      }
      .quick-card-icon {
        width: 34px;
        height: 34px;
        background: rgba(255, 255, 255, 0.07);
        border-radius: 9px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .quick-card-icon svg {
        width: 17px;
        height: 17px;
        stroke: var(--text2);
        fill: none;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .quick-card-title {
        font-size: 15px;
        font-weight: 600;
      }
      .quick-card-sub {
        font-size: 12px;
        color: var(--text3);
        margin-top: 1px;
      }
      .quick-badge {
        background: rgba(255, 255, 255, 0.1);
        color: var(--text);
        font-size: 11px;
        font-weight: 700;
        padding: 3px 8px;
        border-radius: var(--r-pill);
      }

      .timeline-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin: 0 16px;
      }
      .tl-item {
        background: var(--bg3);
        border-radius: var(--r-lg);
        padding: 14px 16px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        cursor: pointer;
        transition: opacity 0.15s;
      }
      .tl-item:active {
        opacity: 0.7;
      }
      .tl-left {
      }
      .tl-month {
        font-size: 15px;
        font-weight: 500;
      }
      .tl-progress {
        font-size: 13px;
        color: var(--text3);
        margin-top: 2px;
      }
      .tl-done {
        font-size: 13px;
        color: var(--keep);
      }
      .tl-right {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      /* progress ring SVG */
      .prog-ring circle {
        transition: stroke-dasharray 0.4s var(--ease);
      }

      /* ── SWIPE SCREEN ────────────────────────── */
      .swipe-screen {
        position: fixed;
        inset: 0;
        background: var(--bg);
        z-index: 300;
        display: flex;
        flex-direction: column;
        max-width: none;
      }
      .swipe-header {
        padding: 12px 16px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-shrink: 0;
      }
      .back-btn {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        background: var(--bg3);
        border: none;
        color: var(--text);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .back-btn svg {
        width: 18px;
        height: 18px;
        stroke: var(--text);
        fill: none;
        stroke-width: 2.5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .swipe-title-wrap {
        text-align: center;
      }
      .swipe-title {
        font-size: 15px;
        font-weight: 700;
      }
      .swipe-sub {
        font-size: 12px;
        color: var(--text3);
        margin-top: 1px;
      }
      .undo-btn {
        display: flex;
        align-items: center;
        gap: 5px;
        background: var(--bg3);
        border: 1px solid var(--border2);
        color: var(--text);
        padding: 8px 14px;
        border-radius: var(--r-pill);
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        font-family: var(--font);
        transition: opacity 0.15s;
      }
      .undo-btn svg {
        width: 13px;
        height: 13px;
        stroke: currentColor;
        fill: none;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .undo-btn:active {
        opacity: 0.6;
      }

      .swipe-arena {
        flex: 1;
        position: relative;
        overflow: hidden;
      }
      .swipe-card {
        position: absolute;
        inset: 10px;
        border-radius: var(--r-lg);
        overflow: hidden;
        background: var(--bg3);
        cursor: grab;
        user-select: none;
        touch-action: none;
        will-change: transform;
        transition: transform 0.3s var(--ease);
      }
      .swipe-card:active {
        cursor: grabbing;
      }
      .swipe-card img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: #000;
        pointer-events: none;
        display: block;
      }
      .swipe-card-empty {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 8px;
        color: var(--text3);
      }
      .swipe-card-empty svg {
        width: 48px;
        height: 48px;
        stroke: var(--text3);
        fill: none;
        stroke-width: 1.2;
        stroke-linecap: round;
        stroke-linejoin: round;
        opacity: 0.4;
      }
      .swipe-card-empty-txt {
        font-size: 15px;
        font-weight: 500;
        opacity: 0.5;
      }

      .swipe-overlay {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.08s;
        border-radius: var(--r-lg);
      }
      .swipe-overlay.del {
        background: rgba(255, 69, 58, 0.25);
      }
      .swipe-overlay.kp {
        background: rgba(48, 209, 88, 0.25);
      }
      .swipe-overlay-tag {
        font-size: 30px;
        font-weight: 900;
        letter-spacing: 2px;
        border: 3.5px solid currentColor;
        padding: 7px 18px;
        border-radius: 10px;
      }
      .swipe-overlay.del .swipe-overlay-tag {
        color: var(--delete);
      }
      .swipe-overlay.kp .swipe-overlay-tag {
        color: var(--keep);
      }

      .card-info-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        padding: 16px;
        background: linear-gradient(transparent, rgba(0, 0, 0, 0.75));
      }
      .card-fname {
        font-size: 13px;
        font-weight: 600;
        color: #fff;
      }
      .card-fmeta {
        font-size: 11px;
        color: rgba(255, 255, 255, 0.5);
        margin-top: 2px;
      }

      .badge {
        position: absolute;
        top: 12px;
        right: 12px;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.5px;
        padding: 4px 10px;
        border-radius: var(--r-pill);
        display: flex;
        align-items: center;
        gap: 5px;
      }
      .badge svg {
        width: 11px;
        height: 11px;
        stroke: currentColor;
        fill: none;
        stroke-width: 2.2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .badge-blur {
        background: rgba(255, 69, 58, 0.8);
        color: #fff;
      }
      .badge-dup {
        background: rgba(255, 159, 10, 0.8);
        color: #fff;
      }

      .swipe-actions {
        padding: 12px 20px 16px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-shrink: 0;
      }
      .action-btn {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 13px 20px;
        border-radius: var(--r-pill);
        font-size: 14px;
        font-weight: 800;
        letter-spacing: 0.5px;
        border: none;
        cursor: pointer;
        font-family: var(--font);
        transition:
          transform 0.15s,
          opacity 0.15s;
      }
      .action-btn:active {
        transform: scale(0.94);
      }
      .del-btn {
        background: rgba(255, 69, 58, 0.15);
        color: var(--delete);
        border: 1.5px solid rgba(255, 69, 58, 0.25);
      }
      .kp-btn {
        background: rgba(48, 209, 88, 0.15);
        color: var(--keep);
        border: 1.5px solid rgba(48, 209, 88, 0.25);
      }
      .act-num {
        min-width: 24px;
        height: 24px;
        border-radius: 12px;
        background: currentColor;
        color: var(--bg);
        font-size: 10px;
        font-weight: 900;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0 6px;
      }

      .done-screen {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%;
        gap: 12px;
      }
      .done-icon {
        width: 64px;
        height: 64px;
        stroke: var(--text3);
        fill: none;
        stroke-width: 1;
        stroke-linecap: round;
        stroke-linejoin: round;
        opacity: 0.35;
      }
      .done-title {
        font-size: 22px;
        font-weight: 800;
        color: var(--text);
      }
      .done-sub {
        font-size: 14px;
        color: var(--text3);
      }

      /* ── GALLERY TAB ─────────────────────────── */
      .gallery-date-hdr {
        font-size: 13px;
        font-weight: 600;
        color: var(--text2);
        padding: 14px 16px 8px;
      }
      .gallery-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 2.5px;
        padding: 0 0;
      }
      .g-cell {
        aspect-ratio: 1;
        background: var(--bg3);
        overflow: hidden;
        cursor: pointer;
        transition: opacity 0.15s;
      }
      .g-cell:first-child {
        border-top-left-radius: var(--r);
      }
      .g-cell:nth-child(3) {
        border-top-right-radius: var(--r);
      }
      .g-cell:active {
        opacity: 0.7;
      }
      .g-cell img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .g-cell-ph {
        width: 100%;
        height: 100%;
        background: var(--bg3);
      }

      /* ── ALBUMS TAB ──────────────────────────── */
      .albums-scroll {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        padding-bottom: 4px;
        padding-left: 16px;
        padding-right: 16px;
      }
      .albums-scroll::-webkit-scrollbar {
        display: none;
      }
      .al-card {
        border-radius: var(--r-lg);
        overflow: hidden;
        position: relative;
        cursor: pointer;
        flex-shrink: 0;
        background: var(--bg3);
        transition: transform 0.15s;
      }
      .al-card:active {
        transform: scale(0.97);
      }
      .al-label-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        padding: 8px 10px;
        font-size: 12px;
        font-weight: 600;
        background: linear-gradient(transparent, rgba(0, 0, 0, 0.65));
      }
      .al-2col {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .al-lg {
        aspect-ratio: 1;
      }
      .al-sm {
        aspect-ratio: 1;
        width: 128px;
      }

      /* ── SETTINGS TAB ────────────────────────── */
      .settings-section {
        margin: 0 16px 20px;
      }
      .settings-group {
        background: var(--bg3);
        border-radius: var(--r-lg);
        overflow: hidden;
      }
      .srow {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 13px 16px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        cursor: pointer;
        transition: opacity 0.15s;
      }
      .srow:last-child {
        border-bottom: none;
      }
      .srow:active {
        opacity: 0.7;
      }
      .srow-left {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .srow-icon {
        width: 30px;
        height: 30px;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(255, 255, 255, 0.07);
      }
      .srow-icon svg {
        width: 15px;
        height: 15px;
        stroke: var(--text2);
        fill: none;
        stroke-width: 1.9;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .srow-label {
        font-size: 15px;
      }
      .srow-sub {
        font-size: 11px;
        color: var(--text3);
        margin-top: 1px;
      }
      .srow-right {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        color: var(--text3);
      }
      .srow-right svg {
        width: 13px;
        height: 13px;
        stroke: var(--text3);
        fill: none;
        stroke-width: 2.5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .st-label {
        font-size: 11px;
        font-weight: 600;
        color: var(--text3);
        letter-spacing: 0.7px;
        text-transform: uppercase;
        margin-bottom: 8px;
      }

      /* storage chart */
      .stor-card {
        background: var(--bg3);
        border-radius: var(--r-lg);
        padding: 16px;
        margin: 0 16px 10px;
      }
      .stor-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        margin-bottom: 16px;
      }
      .stor-lbl {
        font-size: 15px;
        font-weight: 600;
      }
      .stor-days {
        font-size: 11px;
        color: var(--text3);
        margin-top: 2px;
      }
      .stor-amount {
        font-size: 26px;
        font-weight: 800;
        text-align: right;
        letter-spacing: -0.5px;
      }
      .stor-change {
        font-size: 11px;
        color: var(--keep);
        text-align: right;
        margin-top: 1px;
      }
      .bar-row {
        display: flex;
        align-items: flex-end;
        gap: 2.5px;
        height: 72px;
      }
      .b {
        flex: 1;
        background: rgba(255, 255, 255, 0.13);
        border-radius: 2px 2px 0 0;
        min-height: 3px;
        transition: height 0.4s var(--ease);
      }
      .b.hi {
        background: rgba(255, 255, 255, 0.75);
      }
      .chart-dates {
        display: flex;
        justify-content: space-between;
        margin-top: 6px;
      }
      .chart-date {
        font-size: 10px;
        color: var(--text3);
      }

      /* toggle */
      .tog {
        width: 48px;
        height: 28px;
        background: var(--surface);
        border-radius: 14px;
        position: relative;
        cursor: pointer;
        transition: background 0.2s;
        flex-shrink: 0;
      }
      .tog.on {
        background: var(--keep);
      }
      .tog-knob {
        position: absolute;
        top: 3px;
        left: 3px;
        width: 22px;
        height: 22px;
        background: #fff;
        border-radius: 50%;
        transition: transform 0.2s;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
      }
      .tog.on .tog-knob {
        transform: translateX(20px);
      }

      /* theme selector */
      .theme-opts {
        display: flex;
        gap: 5px;
      }
      .th-opt {
        padding: 5px 12px;
        border-radius: var(--r-pill);
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        border: 1.5px solid transparent;
        transition: all 0.15s;
        color: var(--text3);
      }
      .th-opt.active {
        background: var(--surface);
        border-color: rgba(255, 255, 255, 0.18);
        color: var(--text);
      }

      /* accent dots */
      .accent-row {
        display: flex;
        gap: 7px;
        align-items: center;
      }
      .ac-dot {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        cursor: pointer;
        transition: transform 0.15s;
        border: 2px solid transparent;
        flex-shrink: 0;
      }
      .ac-dot.active {
        border-color: #fff;
        transform: scale(1.15);
      }
      .ac-dot:active {
        transform: scale(0.9);
      }
      .ac-add {
        background: var(--surface);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .ac-add svg {
        width: 13px;
        height: 13px;
        stroke: var(--text3);
        fill: none;
        stroke-width: 2.5;
        stroke-linecap: round;
      }

      /* user pill top-right */
      .user-pill {
        display: flex;
        align-items: center;
        gap: 8px;
        background: var(--bg3);
        border-radius: var(--r-pill);
        padding: 7px 14px 7px 8px;
        cursor: pointer;
      }
      .user-pill-av {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        background: var(--surface);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .user-pill-av svg {
        width: 14px;
        height: 14px;
        stroke: var(--text2);
        fill: none;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .user-pill-name {
        font-size: 13px;
        font-weight: 600;
      }

      /* online dot */
      .online-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--keep);
        flex-shrink: 0;
      }

      /* sensitivity slider */
      .sens-row {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      input[type="range"] {
        -webkit-appearance: none;
        flex: 1;
        height: 4px;
        border-radius: 2px;
        background: var(--surface);
        outline: none;
        cursor: pointer;
      }
      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: #fff;
        cursor: pointer;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.4);
      }

      /* ── TOAST ───────────────────────────────── */
      .toast {
        position: fixed;
        top: 56px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(40, 40, 40, 0.95);
        backdrop-filter: blur(20px);
        color: #fff;
        padding: 9px 20px;
        border-radius: var(--r-pill);
        font-size: 13px;
        font-weight: 500;
        z-index: 999;
        pointer-events: none;
        border: 1px solid var(--border2);
        white-space: nowrap;
        animation: toastIn 0.25s var(--ease);
      }
      @keyframes toastIn {
        from {
          opacity: 0;
          transform: translateX(-50%) translateY(-8px);
        }
        to {
          opacity: 1;
          transform: translateX(-50%) translateY(0);
        }
      }

      /* ── LOADING ─────────────────────────────── */
      .spinner {
        width: 18px;
        height: 18px;
        border: 2px solid rgba(255, 255, 255, 0.2);
        border-top-color: #fff;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        flex-shrink: 0;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* ── SCROLL PADDING ──────────────────────── */
      .pb16 {
        padding-bottom: 16px;
      }
    </style>
