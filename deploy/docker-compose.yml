# EasyClean — production compose for a Linux home server.
#
# Lives at /opt/easyclean/docker-compose.yml. Unlike the compose file at the
# repo root (which builds from source), this one pulls a prebuilt image from
# GHCR — CI publishes it and the deploy workflow flips EASYCLEAN_IMAGE_TAG here.
#
# Install:  see deploy/README.md
services:
  easyclean:
    image: ghcr.io/${GITHUB_REPOSITORY:-sai-zack-dev/easyclean}:${EASYCLEAN_IMAGE_TAG:-latest}
    container_name: easyclean
    restart: unless-stopped

    # Runs as uid 10001 inside the image; the host dirs must be owned by it.
    volumes:
      # Media is read-WRITE on purpose — EasyClean moves files between
      # source/ clean/ .trash/. Mounting it ":ro" breaks the whole app.
      - ${MEDIA_ROOT:?set MEDIA_ROOT in .env}:/media
      # SQLite index, thumbnail cache, and the generated JWT secret. Losing
      # this volume means a rescan and logged-out sessions, not lost photos.
      - ${DATA_DIR:-/opt/easyclean/data}:/data

    environment:
      EASYCLEAN_USER: ${EASYCLEAN_USER:-admin}
      EASYCLEAN_PASSCODE: ${EASYCLEAN_PASSCODE:?set EASYCLEAN_PASSCODE in .env}
      # Multi-user: "name:passcode[:role],name2:passcode2". When set it REPLACES
      # the single EASYCLEAN_USER/PASSCODE seed above. Each name needs its own
      # <MEDIA_ROOT>/<name>/source folder.
      EASYCLEAN_USERS: ${EASYCLEAN_USERS:-}
      # Optional: omit and the server generates + persists /data/secret.key.
      EASYCLEAN_SECRET: ${EASYCLEAN_SECRET:-}
      EASYCLEAN_TRASH_RETENTION_DAYS: ${EASYCLEAN_TRASH_RETENTION_DAYS:-30}
      EASYCLEAN_BLUR_THRESHOLD: ${EASYCLEAN_BLUR_THRESHOLD:-100}
      # Per-user upload ceilings: "name=20GB,name2=50GB". Sizes take K/M/G/T
      # suffixes and are binary (20GB = 20 GiB); a user not listed here is
      # unlimited, bounded only by EASYCLEAN_DISK_FLOOR below.
      #
      # A *fallback*, not the authority: a quota set in the app is stored per
      # user and wins over this. Nothing copies these values into the database,
      # so unlike the account seeding above, a restart cannot undo an admin's
      # change.
      EASYCLEAN_QUOTAS: ${EASYCLEAN_QUOTAS:-}
      # Refuse new uploads once free space on the media filesystem falls below
      # this. Deleting, browsing and emptying the trash keep working — which
      # they would not if the disk were allowed to reach zero, since SQLite
      # cannot write and a trash move needs somewhere to write to.
      EASYCLEAN_DISK_FLOOR: ${EASYCLEAN_DISK_FLOOR:-5G}
      # Bytes per upload chunk. Also the ceiling on one request body, so raising
      # it raises the memory a single upload can make the server hold.
      EASYCLEAN_UPLOAD_CHUNK_SIZE: ${EASYCLEAN_UPLOAD_CHUNK_SIZE:-10M}
      # No EASYCLEAN_DUPLICATE_DISTANCE_THRESHOLD: duplicate sensitivity moved
      # to a per-user setting in the app. The server still falls back to its
      # own default (10) for a user who has never touched that slider.
      RUST_LOG: ${RUST_LOG:-info}

    # Bind to the LAN interface only by default. EasyClean speaks plain HTTP;
    # it must never be published straight to the internet (see README security).
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${PORT:-8080}:8080"

    # ── Containment ────────────────────────────────────────────────────────
    #
    # Every photo indexed is a file this server did not write, and two of the
    # things that read it are C libraries: libheif decodes iPhone HEIC, ffmpeg
    # reads video. Rust's guarantees stop at that boundary, so the answer to "a
    # malformed file reaches libheif" is not a safer decoder — it is to make the
    # process it runs in worth as little as possible.
    security_opt:
      # No setuid binary inside can raise privileges, however it is invoked.
      - no-new-privileges:true
    cap_drop:
      # The server binds 8080 inside the container, which needs no capability
      # at all — it is above 1024 and the port is published by Docker.
      - ALL
    read_only: true
    tmpfs:
      # The root filesystem is read-only, so the one writable path left is
      # small, private to the container, and gone on restart. ffmpeg writes its
      # thumbnails into /data, which is a volume and stays writable.
      - /tmp:size=256m,mode=1777
    # Bounds what any single decode — Rust's, libheif's or ffmpeg's — can cost
    # the host. `image` refuses to allocate more than 512 MiB for one decode,
    # but nothing inside libheif is bound by that.
    mem_limit: ${EASYCLEAN_MEM_LIMIT:-2g}
    pids_limit: 512

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
