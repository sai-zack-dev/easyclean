<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EasyClean</title>
  <style>
    :root {
      --bg:      #0a0a0a;
      --bg2:     #111111;
      --bg3:     #1c1c1e;
      --bg4:     #2c2c2e;
      --surface: #3a3a3c;
      --text:    #ffffff;
      --text2:   rgba(255,255,255,.55);
      --text3:   rgba(255,255,255,.28);
      --keep:    #30d158;
      --delete:  #ff453a;
      --border:  rgba(255,255,255,.08);
      --border2: rgba(255,255,255,.14);
      --r:       12px;
      --r-pill:  100px;
      --font:    -apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, sans-serif;
    }
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 14px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    /* ── TITLE BAR ─────────────────────────── */
    .titlebar {
      height: 48px;
      display: flex;
      align-items: center;
      padding: 0 20px;
      gap: 10px;
      flex-shrink: 0;
      /* Allow native macOS drag */
      -webkit-app-region: drag;
    }
    .brand-icon {
      width: 28px; height: 28px;
      background: var(--text);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      -webkit-app-region: no-drag;
    }
    .brand-icon svg {
      width: 16px; height: 16px;
      stroke: var(--bg); fill: none;
      stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;
    }
    .brand-name { font-size: 16px; font-weight: 700; letter-spacing: -.3px; }
    .brand-ver  { font-size: 10px; color: var(--text3); margin-left: 2px; }

    /* ── MAIN SCROLL AREA ──────────────────── */
    .body {
      flex: 1;
      overflow-y: auto;
      padding: 8px 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .body::-webkit-scrollbar { width: 0; }

    /* ── CARD ──────────────────────────────── */
    .card {
      background: var(--bg3);
      border-radius: var(--r);
      overflow: hidden;
    }
    .card-row {
      display: flex;
      align-items: center;
      padding: 13px 14px;
      gap: 10px;
      border-bottom: 1px solid rgba(255,255,255,.05);
    }
    .card-row:last-child { border-bottom: none; }

    .row-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text3);
      letter-spacing: .6px;
      text-transform: uppercase;
      margin-bottom: 6px;
      padding: 0 2px;
    }

    /* ── FOLDER ROW ────────────────────────── */
    .folder-text {
      flex: 1;
      font-size: 13px;
      color: var(--text2);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
    }
    .folder-text.set { color: var(--text); }

    /* ── INPUTS ────────────────────────────── */
    input[type="text"], input[type="number"] {
      background: transparent;
      border: none;
      color: var(--text);
      font-family: var(--font);
      font-size: 14px;
      outline: none;
      width: 100%;
    }
    input[type="number"] { width: 64px; text-align: right; }
    input::placeholder { color: var(--text3); }

    /* ── BUTTONS ───────────────────────────── */
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      gap: 6px;
      border: none; cursor: pointer;
      font-family: var(--font); font-weight: 600;
      transition: opacity .15s, transform .1s;
    }
    .btn:active { opacity: .7; transform: scale(.97); }
    .btn:disabled { opacity: .35; cursor: not-allowed; transform: none; }

    .btn-icon {
      width: 30px; height: 30px;
      background: var(--bg4);
      border-radius: 8px;
      font-size: 14px;
      color: var(--text2);
    }
    .btn-pill {
      padding: 9px 18px;
      border-radius: var(--r-pill);
      font-size: 13px;
    }
    .btn-start  { background: var(--keep);   color: #000; }
    .btn-stop   { background: var(--delete); color: #fff; }
    .btn-browse { background: var(--bg4); color: var(--text2); border-radius: 8px; padding: 6px 12px; font-size: 12px; }
    .btn-open   {
      width: 100%;
      background: rgba(255,255,255,.08);
      border: 1px solid var(--border2);
      color: var(--text);
      border-radius: var(--r);
      padding: 11px;
      font-size: 13px;
      margin-top: 10px;
    }
    .btn-copy {
      background: var(--bg4);
      color: var(--text2);
      border-radius: 7px;
      padding: 5px 9px;
      font-size: 11px;
      font-weight: 600;
    }

    /* ── STATUS ROW ────────────────────────── */
    .status-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 16px;
      background: var(--bg3);
      border-radius: var(--r);
    }
    .status-left { display: flex; align-items: center; gap: 10px; }
    .dot {
      width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0;
      transition: background .3s;
    }
    .dot.on  { background: var(--keep);   box-shadow: 0 0 6px var(--keep); }
    .dot.off { background: var(--surface); }
    .status-text { font-size: 14px; font-weight: 600; }

    /* ── SERVER URL CARD ────────────────────── */
    .url-card {
      background: var(--bg3);
      border-radius: var(--r);
      padding: 14px 16px;
      display: none;
    }
    .url-card.visible { display: block; }
    .url-line {
      display: flex; align-items: center; gap: 8px; margin-bottom: 12px;
    }
    .url-text {
      flex: 1;
      font-size: 13px; font-weight: 600;
      color: var(--text);
      font-family: ui-monospace, "SF Mono", monospace;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .qr-wrap {
      display: flex; justify-content: center;
      background: #111;
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 10px;
    }
    .qr-wrap svg { display: block; }

    /* ── SEPARATOR ─────────────────────────── */
    .sep { height: 1px; background: var(--border); flex-shrink: 0; }

    /* ── CREDENTIALS ───────────────────────── */
    .cred-note {
      font-size: 11px;
      color: var(--text3);
      line-height: 1.5;
      padding: 0 2px;
    }
    .cred-note b { color: var(--text2); font-weight: 600; }

    /* ── TOAST ─────────────────────────────── */
    .toast {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: rgba(50,50,50,.95); backdrop-filter: blur(20px);
      color: #fff; padding: 8px 18px; border-radius: var(--r-pill);
      font-size: 12px; font-weight: 500; pointer-events: none;
      opacity: 0; transition: opacity .2s; z-index: 100;
      white-space: nowrap; border: 1px solid var(--border2);
    }
    .toast.show { opacity: 1; }

    /* ── ERROR BANNER ──────────────────────── */
    .error-banner {
      background: rgba(255,69,58,.12);
      border: 1px solid rgba(255,69,58,.25);
      border-radius: var(--r);
      padding: 10px 14px;
      font-size: 12px;
      color: #ff6b63;
      line-height: 1.5;
      display: none;
    }
    .error-banner.visible { display: block; }
  </style>
</head>
<body>

  <!-- Title bar -->
  <div class="titlebar">
    <div class="brand-icon">
      <svg viewBox="0 0 24 24"><path d="M3 21l9-9M9.5 3.5l1.5 1.5-7 7-1.5-1.5z"/><path d="M14 4l6 6-9 9H5v-6z"/></svg>
    </div>
    <span class="brand-name">EasyClean</span>
    <span class="brand-ver">MVP</span>
  </div>

  <div class="body">

    <!-- Folder picker -->
    <div>
      <div class="row-label">Media Folder</div>
      <div class="card">
        <div class="card-row">
          <span id="folderText" class="folder-text">No folder selected…</span>
          <button class="btn btn-browse" onclick="pickFolder()">Browse</button>
        </div>
      </div>
    </div>

    <!-- Port + credentials -->
    <div>
      <div class="row-label">Server Settings</div>
      <div class="card">
        <div class="card-row">
          <span style="flex:1; color:var(--text2);">Port</span>
          <input id="portInput" type="number" value="8080" min="1024" max="65535" />
        </div>
        <div class="card-row">
          <span style="flex:1; color:var(--text2);">Username</span>
          <input id="userInput" type="text" value="admin" style="width:100px;text-align:right;" />
        </div>
        <div class="card-row">
          <span style="flex:1; color:var(--text2);">Passcode</span>
          <input id="passInput" type="text" value="easyclean" style="width:100px;text-align:right;" placeholder="passcode" />
        </div>
      </div>
    </div>

    <!-- Start / Stop -->
    <div class="status-row">
      <div class="status-left">
        <div id="dot" class="dot off"></div>
        <span id="statusText" class="status-text">Stopped</span>
      </div>
      <button id="toggleBtn" class="btn btn-pill btn-start" onclick="toggleServer()">Start</button>
    </div>

    <!-- Error banner -->
    <div id="errorBanner" class="error-banner"></div>

    <!-- Server URL + QR (shown when running) -->
    <div id="urlCard" class="url-card">
      <div class="url-line">
        <span id="urlText" class="url-text"></span>
        <button class="btn btn-copy" onclick="copyUrl()">Copy</button>
      </div>
      <div class="qr-wrap" id="qrWrap"></div>
      <button class="btn btn-open" onclick="openBrowser()">Open in Browser ↗</button>
    </div>

    <!-- Credentials note -->
    <div class="cred-note" id="credNote" style="display:none">
      Sign in at the browser with your configured username and passcode.
    </div>

  </div>

  <div class="toast" id="toast"></div>

  <script>
    const { invoke } = window.__TAURI__.core;

    let currentUrl = null;
    let config = { media_root: '', port: 8080, username: 'admin', passcode: 'easyclean' };
    let pollTimer = null;

    // ── Init ──────────────────────────────────────────────────────────────────

    async function init() {
      config = await invoke('load_config');
      if (config.media_root) {
        setFolderDisplay(config.media_root);
      }
      document.getElementById('portInput').value = config.port || 8080;
      document.getElementById('userInput').value = config.username || 'admin';
      document.getElementById('passInput').value = config.passcode || 'easyclean';

      // Restore running state if server is already up (e.g. after hot-reload)
      const running = await invoke('server_status');
      if (running) {
        const url = await invoke('get_server_url');
        if (url) onServerStarted(url);
      }
    }

    // ── Folder picker ─────────────────────────────────────────────────────────

    async function pickFolder() {
      const folder = await invoke('pick_folder');
      if (folder) {
        config.media_root = folder;
        setFolderDisplay(folder);
        await saveConfig();
      }
    }

    function setFolderDisplay(path) {
      const el = document.getElementById('folderText');
      // Show only the last 2 path segments for brevity
      const parts = path.replace(/\\/g, '/').split('/').filter(Boolean);
      el.textContent = parts.length > 2
        ? '…/' + parts.slice(-2).join('/')
        : path;
      el.title = path;
      el.classList.add('set');
    }

    // ── Server toggle ─────────────────────────────────────────────────────────

    async function toggleServer() {
      const btn = document.getElementById('toggleBtn');
      btn.disabled = true;
      hideError();

      if (currentUrl) {
        // Stop
        try {
          await invoke('stop_server');
        } catch (e) {
          showError(e);
        }
        onServerStopped();
      } else {
        // Start — collect latest field values
        config.port     = parseInt(document.getElementById('portInput').value) || 8080;
        config.username = document.getElementById('userInput').value.trim() || 'admin';
        config.passcode = document.getElementById('passInput').value.trim() || 'easyclean';
        await saveConfig();

        try {
          const url = await invoke('start_server', { config });
          onServerStarted(url);
        } catch (e) {
          showError(typeof e === 'string' ? e : e.message || JSON.stringify(e));
        }
      }
      btn.disabled = false;
    }

    function onServerStarted(url) {
      currentUrl = url;
      document.getElementById('dot').className        = 'dot on';
      document.getElementById('statusText').textContent = 'Running';
      document.getElementById('toggleBtn').textContent  = 'Stop';
      document.getElementById('toggleBtn').className    = 'btn btn-pill btn-stop';
      document.getElementById('urlText').textContent    = url;
      document.getElementById('urlCard').classList.add('visible');
      document.getElementById('credNote').style.display = 'block';
      renderQr(url);
      startPolling();
    }

    function onServerStopped() {
      currentUrl = null;
      document.getElementById('dot').className        = 'dot off';
      document.getElementById('statusText').textContent = 'Stopped';
      document.getElementById('toggleBtn').textContent  = 'Start';
      document.getElementById('toggleBtn').className    = 'btn btn-pill btn-start';
      document.getElementById('urlCard').classList.remove('visible');
      document.getElementById('credNote').style.display = 'none';
      document.getElementById('qrWrap').innerHTML = '';
      stopPolling();
    }

    // ── QR code ───────────────────────────────────────────────────────────────

    async function renderQr(url) {
      const svg = await invoke('generate_qr', { url });
      document.getElementById('qrWrap').innerHTML = svg;
    }

    // ── Open browser ──────────────────────────────────────────────────────────

    async function openBrowser() {
      if (!currentUrl) return;
      try {
        await invoke('open_browser', { url: currentUrl });
      } catch (e) {
        showError(e);
      }
    }

    // ── Copy URL ──────────────────────────────────────────────────────────────

    async function copyUrl() {
      if (!currentUrl) return;
      try {
        await navigator.clipboard.writeText(currentUrl);
        showToast('Copied!');
      } catch {
        showToast(currentUrl);
      }
    }

    // ── Config persistence ────────────────────────────────────────────────────

    async function saveConfig() {
      await invoke('save_config', { config }).catch(() => {});
    }

    // ── Health polling (detect if server crashed) ─────────────────────────────

    function startPolling() {
      stopPolling();
      pollTimer = setInterval(async () => {
        const running = await invoke('server_status');
        if (!running && currentUrl) onServerStopped();
      }, 4000);
    }

    function stopPolling() {
      if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
    }

    // ── UI helpers ────────────────────────────────────────────────────────────

    function showToast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 2000);
    }

    function showError(msg) {
      const el = document.getElementById('errorBanner');
      el.textContent = msg;
      el.classList.add('visible');
    }

    function hideError() {
      document.getElementById('errorBanner').classList.remove('visible');
    }

    // ── Save config on field change ───────────────────────────────────────────

    ['portInput', 'userInput', 'passInput'].forEach(id => {
      document.getElementById(id).addEventListener('change', async () => {
        config.port     = parseInt(document.getElementById('portInput').value) || 8080;
        config.username = document.getElementById('userInput').value.trim();
        config.passcode = document.getElementById('passInput').value.trim();
        await saveConfig();
      });
    });

    // ── Boot ──────────────────────────────────────────────────────────────────

    init();
  </script>

</body>
</html>
