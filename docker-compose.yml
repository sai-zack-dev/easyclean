# Local / from-source compose. Builds the image out of this checkout.
#
# For a real home-server deployment use deploy/docker-compose.yml instead —
# it pulls the published GHCR image and is what CI rolls out to /opt/easyclean.
services:
  easyclean:
    build: .
    image: easyclean:latest
    container_name: easyclean
    restart: unless-stopped
    # NOTE: media is mounted read-WRITE — EasyClean moves files between
    # source/ clean/ .trash/. It must not be ":ro".
    volumes:
      - ${MEDIA_ROOT}:/media
      - ./data:/data
    environment:
      # Auth. Required — there is no default passcode, and the server refuses
      # to create a first account without one. Anyone on the network can reach
      # this port, so a built-in value would be a credential they already know.
      EASYCLEAN_USER: ${EASYCLEAN_USER:-admin}
      EASYCLEAN_PASSCODE: ${EASYCLEAN_PASSCODE:?set EASYCLEAN_PASSCODE in .env}
      # JWT signing secret. Optional: leave it empty and the server generates
      # one into /data/secret.key on first boot (persisted across restarts).
      # Set it explicitly to manage rotation yourself: openssl rand -hex 32
      EASYCLEAN_SECRET: ${EASYCLEAN_SECRET:-}
      EASYCLEAN_TRASH_RETENTION_DAYS: ${EASYCLEAN_TRASH_RETENTION_DAYS:-30}
      RUST_LOG: ${RUST_LOG:-info}
    ports:
      - "${PORT:-8080}:8080"

    # Same containment as the production compose — a malformed photo reaches
    # libheif and ffmpeg here too, and a local run that behaves differently from
    # production is not much of a rehearsal. See deploy/docker-compose.yml for
    # why each of these is here.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    mem_limit: ${EASYCLEAN_MEM_LIMIT:-2g}
    pids_limit: 512
